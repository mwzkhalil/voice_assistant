# =============================================================================
# Nginx reverse proxy for Voice Assistant
# Handles: HTTPS termination, WebSocket upgrade, rate limiting, static files
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream voice_assistant {
    server voice-assistant:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # =========================================================================
    # TLS Configuration
    # Replace with your actual certificate paths
    # =========================================================================
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size
    client_max_body_size 1m;

    # =========================================================================
    # WebSocket Realtime Endpoint
    # =========================================================================
    location /ws/realtime {
        # Rate limit: 10 new connections per minute per IP
        limit_req zone=ws_limit burst=5 nodelay;
        # Max 5 concurrent WebSocket connections per IP
        limit_conn ws_conn 5;

        proxy_pass http://voice_assistant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # =========================================================================
    # Debug WebSocket
    # =========================================================================
    location /ws/debug {
        limit_req zone=ws_limit burst=2 nodelay;

        proxy_pass http://voice_assistant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # =========================================================================
    # API Endpoints (health, ready, metrics)
    # =========================================================================
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://voice_assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Enable keepalive
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # =========================================================================
    # Static files (test client)
    # =========================================================================
    location /static/ {
        proxy_pass http://voice_assistant/static/;
        proxy_cache_valid 200 1h;
        proxy_set_header Host $host;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
